# lint -> test -> build -> ECR -> staging -> smoke -> (approval) -> prod -> smoke
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role; no long-lived AWS keys

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # Deploys are skipped (not failed) until AWS is set up: set the repository variable
  # DEPLOY_ENABLED=true after following infra/README.md.
  staging:
    needs: checks
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: staging
      build: true
    secrets: inherit

  prod:
    needs: staging
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: prod
      build: false # promote the exact image that passed staging
    secrets: inherit
