# One-click operations. Model jobs run inside the VPC as ECS tasks (they need MLflow + RDS).
name: ops
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [staging, prod]
      action:
        type: choice
        options:
          - rollback-model   # restore the previous champion (scripts/rollback.py)
          - rollback-app     # redeploy a previous image tag
          - retrain          # scripts/retrain.py now
          - backfill         # scripts/backfill.py (resumable)
          - materialize      # rebuild the Redis online store now
      image_tag:
        description: "rollback-app: image tag (git SHA) to redeploy"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      CLUSTER: preflight-${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback app to ${{ inputs.image_tag }}
        if: inputs.action == 'rollback-app'
        uses: hashicorp/setup-terraform@v3
      - if: inputs.action == 'rollback-app'
        working-directory: infra/terraform
        run: |
          test -n "${{ inputs.image_tag }}"
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=preflight/${{ inputs.env }}.tfstate" \
            -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          terraform apply -input=false -auto-approve \
            -var-file=env/${{ inputs.env }}.tfvars -var image_tag=${{ inputs.image_tag }}

      - name: Run job in the VPC
        if: inputs.action != 'rollback-app'
        run: |
          case "${{ inputs.action }}" in
            rollback-model) DEF=monitor; CMD='["python","scripts/rollback.py"]' ;;
            retrain)        DEF=monitor; CMD='["python","scripts/retrain.py"]' ;;
            backfill)       DEF=backfill; CMD='["python","scripts/backfill.py"]' ;;
            materialize)    DEF=materialize; CMD='["python","scripts/materialize.py"]' ;;
          esac
          NET=$(aws ecs describe-services --cluster $CLUSTER --services worker \
            --query 'services[0].networkConfiguration' --output json)
          TASK=$(aws ecs run-task --cluster $CLUSTER --launch-type FARGATE \
            --task-definition preflight-${{ inputs.env }}-$DEF \
            --network-configuration "$NET" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$DEF\",\"command\":$CMD}]}" \
            --query 'tasks[0].taskArn' --output text)
          echo "started $TASK"
          if [ "${{ inputs.action }}" != "backfill" ]; then
            aws ecs wait tasks-stopped --cluster $CLUSTER --tasks $TASK
            test "$(aws ecs describe-tasks --cluster $CLUSTER --tasks $TASK \
              --query 'tasks[0].containers[0].exitCode' --output text)" = "0"
          fi
