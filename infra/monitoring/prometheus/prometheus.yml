global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: scorer
    static_configs: [{targets: ["scorer:8001"]}]
  - job_name: ingest
    static_configs: [{targets: ["ingest:8000"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:9102"]}]
  - job_name: pushgateway          # batch jobs: monitor, retrain
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]
