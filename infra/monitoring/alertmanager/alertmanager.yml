route:
  receiver: slack
  group_by: [alertname]
  group_wait: 30s
  repeat_interval: 4h
receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        channel: "#preflight-alerts"
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.runbook }}\n{{ end }}"
